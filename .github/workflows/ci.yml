name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Detect which top-level directories changed so each job below only runs when
  # its own files were touched (or the workflow file itself was edited).
  changes:
    runs-on: [self-hosted, linux, akd-mi]
    outputs:
      backend:  ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      portal:   ${{ steps.filter.outputs.portal }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            portal:
              - 'portal/**'
              - 'docker-compose.yml'
              - 'scripts/**'
              - 'akd-mi'
              - 'templates/**'
              - '.github/workflows/ci.yml'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: [self-hosted, linux, akd-mi]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        working-directory: backend
        run: npm ci
      - name: Prisma generate
        working-directory: backend
        run: npx prisma generate
      - name: Typecheck/build
        working-directory: backend
        run: npm run build
      - name: Test
        working-directory: backend
        run: npm test

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: [self-hosted, linux, akd-mi]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4100
        run: npm run build

  deploy-portal:
    needs: changes
    if: needs.changes.outputs.portal == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: [self-hosted, linux, akd-mi]
    concurrency:
      group: deploy-portal
      cancel-in-progress: false
    env:
      DEPLOY_DIR: /opt/akd-mi-v2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure deploy dir exists and is writable
        run: |
          if [ ! -d "$DEPLOY_DIR" ]; then
            sudo install -d -o "$USER" -g "$USER" "$DEPLOY_DIR"
          fi
          # If a previous run created it as root, take ownership once.
          if [ ! -w "$DEPLOY_DIR" ]; then
            sudo chown -R "$USER:$USER" "$DEPLOY_DIR"
          fi

      - name: Sync repo to deploy dir
        run: |
          # NOTE: only the TOP-LEVEL 'instances/' dir is excluded. It is a
          # runtime-managed directory: the portal container (running as root)
          # creates per-tenant subfolders, .env files, nginx configs, backups,
          # etc. The runner user can't delete those, so letting rsync --delete
          # touch the tree fails with EACCES. Treat the deployed instances/ as
          # state, not as code.
          #
          # The leading '/' anchors the pattern to the rsync source root, so
          # nested paths like `portal/src/app/api/admin/instances/` are NOT
          # excluded. (rsync interprets `--exclude 'instances'` without a
          # leading slash as "match any path component named 'instances' at
          # any depth", which silently dropped portal API routes.)
          rsync -a --delete \
            --exclude '/.git' \
            --exclude 'node_modules' \
            --exclude '.next' \
            --exclude '/instances' \
            --exclude '/portal/.env' \
            ./ "$DEPLOY_DIR/"

      - name: Normalize line endings on shell scripts
        run: |
          # Defensive: even with .gitattributes, a contributor on Windows may
          # commit CRLF. Bash refuses to parse CRLF (`set: pipefail\r: invalid
          # option name`), so strip CR from every script before we shell out.
          find "$DEPLOY_DIR" -type f \
            \( -name '*.sh' -o -name 'akd-mi' -o -name 'dbserver' -o -name 'ocompose' \) \
            -not -path '*/node_modules/*' -not -path '*/.next/*' \
            -exec sed -i 's/\r$//' {} +
          chmod +x "$DEPLOY_DIR/akd-mi" 2>/dev/null || true
          find "$DEPLOY_DIR/scripts" -type f -name '*.sh' -exec chmod +x {} + 2>/dev/null || true

      - name: Seed portal/.env on first deploy
        run: |
          cd "$DEPLOY_DIR/portal"
          if [ ! -f .env ]; then
            cp .env.example .env
            echo "::warning ::portal/.env was missing — created from .env.example. Edit it on the server at $DEPLOY_DIR/portal/.env and re-run the deploy."
          fi

      - name: Rebuild & restart portal stack
        working-directory: ${{ env.DEPLOY_DIR }}/portal
        run: |
          docker compose pull --ignore-pull-failures || true
          docker compose up -d --build portal-db portal-web

      - name: Run portal migrations
        working-directory: ${{ env.DEPLOY_DIR }}/portal
        run: |
          # Wait briefly for portal-web to be ready, then sync the schema.
          # The runtime image doesn't ship the Prisma CLI, so npx downloads it.
          # Pin to v6 because the schema still uses `datasource.url` (v7 dropped it).
          sleep 5
          # If a prisma/migrations folder exists, prefer `migrate deploy`. Otherwise
          # (and as a fallback) run `db push` so a fresh DB still gets the schema —
          # `migrate deploy` exits 0 with no migrations, which would otherwise leave
          # the database empty and break the app at runtime.
          if [ -d prisma/migrations ] && [ -n "$(ls -A prisma/migrations 2>/dev/null)" ]; then
            docker compose exec -T portal-web npx -y prisma@6 migrate deploy
          else
            echo "::notice ::No prisma/migrations folder — falling back to 'prisma db push'."
            docker compose exec -T portal-web npx -y prisma@6 db push --accept-data-loss
          fi

      - name: Show portal status
        working-directory: ${{ env.DEPLOY_DIR }}/portal
        run: docker compose ps
