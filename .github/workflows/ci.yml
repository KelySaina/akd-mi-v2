name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: [self-hosted, linux, akd-mi]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Backend — install
        working-directory: backend
        run: npm ci

      - name: Backend — prisma generate
        working-directory: backend
        run: npx prisma generate

      - name: Backend — typecheck/build
        working-directory: backend
        run: npm run build

      - name: Frontend — install
        working-directory: frontend
        run: npm ci

      - name: Frontend — build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4100
        run: npm run build
