name: CI/CD

# Test on every push + PR. Deploy the portal only on green pushes to main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same ref cancels an in-flight run (no overlapping deploys).
concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect which top-level directories changed so each job below only runs when
  # its own files were touched (or the workflow itself was edited).
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend:  ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      portal:   ${{ steps.filter.outputs.portal }}
    steps:
      # paths-filter needs real git history to diff against on push events.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            portal:
              - 'portal/**'
              - 'scripts/**'
              - 'akd-mi'
              - 'templates/**'
              - '.github/workflows/ci.yml'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        working-directory: backend
        run: npm ci
      - name: Prisma generate
        working-directory: backend
        run: npx prisma generate
      - name: Typecheck/build
        working-directory: backend
        run: npm run build
      # The suite sets DATABASE_URL/REDIS_URL as strings for config validation and
      # never dials them, so it needs no service containers here.
      - name: Test
        working-directory: backend
        run: npm test

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4100
        run: npm run build

  # Deploy over SSH, like the other stacks on this host. The previous version of
  # this job ran on a self-hosted runner that WAS the server and rsync'd the
  # working directory into a root-owned /opt checkout — so a build failure and a
  # server outage were the same event, the runner needed write access (and sudo
  # chown) there, and nothing recorded which commit was live. The checkout now
  # lives in the deploy user's home like the other stacks on this host, and the
  # server only runs scripts/deploy-portal.sh, which syncs itself to the SHA.
  deploy-portal:
    needs: [changes, backend, frontend]
    # always(): backend/frontend are skipped when their paths did not change, and
    # a skipped dependency would otherwise skip this too. Deploy when nothing
    # FAILED, rather than when everything ran.
    if: |
      always() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.changes.outputs.portal == 'true' &&
      needs.backend.result != 'failure' &&
      needs.frontend.result != 'failure'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-portal
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 15m
          script: |
            set -e
            DEPLOY_DIR="${AKDMI_PROJECT_DIR:-$HOME/akd-mi-v2}"
            if [ ! -d "$DEPLOY_DIR/.git" ]; then
              echo "::error::$DEPLOY_DIR is not a git checkout on this host — bootstrap it once, then re-run:"
              echo "  git clone https://github.com/${{ github.repository }}.git $DEPLOY_DIR"
              echo "  cp $DEPLOY_DIR/portal/.env.example $DEPLOY_DIR/portal/.env   # then fill it in"
              exit 1
            fi
            cd "$DEPLOY_DIR"
            # Sync to this commit FIRST, so the right deploy script and templates
            # exist before we run them. The token keeps working if this repo is
            # private; a public one fetches fine without it.
            export GITHUB_TOKEN='${{ secrets.GITHUB_TOKEN }}'
            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')" fetch --all --prune
            git checkout --force '${{ github.sha }}'
            export IMAGE_TAG='${{ github.sha }}'
            bash scripts/deploy-portal.sh
