services:
  portal-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: akdmi_portal
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: ${PORTAL_DB_PASSWORD:-changeme}
    volumes:
      - portal_db:/var/lib/postgresql/data
    ports:
      - "${PORTAL_DB_PORT:-5099}:5432"

  portal-web:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on: [portal-db]
    environment:
      DATABASE_URL: postgresql://portal:${PORTAL_DB_PASSWORD:-changeme}@portal-db:5432/akdmi_portal
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
      # Absolute path to the akd-mi project root *as seen from inside the container*.
      # We bind-mount the host's project at the SAME path below so that paths
      # generated by the CLI (e.g. compose --project-directory) resolve identically
      # when the host docker daemon creates bind-mount volumes for child instances.
      AKDMI_PROJECT_DIR: ${AKDMI_PROJECT_DIR:-/opt/akd-mi-v2}
    ports:
      - "${PORTAL_PORT:-3099}:3000"
    volumes:
      # Talk to the host's docker daemon so spawned `akd-mi up <slug>` actually
      # creates containers next to the portal (not nested inside it).
      - /var/run/docker.sock:/var/run/docker.sock
      # Expose the akd-mi project (akd-mi script, scripts/, templates/, instances/)
      # at the SAME path as on the host so docker compose's --project-directory
      # works whether evaluated by the CLI inside the container or by the daemon.
      - ${AKDMI_PROJECT_DIR:-/opt/akd-mi-v2}:${AKDMI_PROJECT_DIR:-/opt/akd-mi-v2}

volumes:
  portal_db:
