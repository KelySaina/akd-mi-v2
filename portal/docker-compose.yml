services:
  portal-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: akdmi_portal
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: ${PORTAL_DB_PASSWORD:-changeme}
    volumes:
      - portal_db:/var/lib/postgresql/data
    ports:
      # Loopback. This published on every interface, which put the portal's own
      # database — the one holding every institution's provisioning record — on
      # the internet. It stays published only for psql and backups from the host.
      - "${BIND_HOST:-127.0.0.1}:${PORTAL_DB_PORT:-5099}:5432"

  portal-web:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on: [portal-db]
    environment:
      DATABASE_URL: postgresql://portal:${PORTAL_DB_PASSWORD:-changeme}@portal-db:5432/akdmi_portal
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
      # Absolute path to the akd-mi project root *as seen from inside the container*.
      # We bind-mount the host's project at the SAME path below so that paths
      # generated by the CLI (e.g. compose --project-directory) resolve identically
      # when the host docker daemon creates bind-mount volumes for child instances.
      AKDMI_PROJECT_DIR: ${AKDMI_PROJECT_DIR:-/opt/akd-mi-v2}
      # Base domain the portal hands to `akd-mi init` when provisioning. With it
      # set, a new instance gets <slug>.<domain>, api.<slug>.<domain> and
      # media.<slug>.<domain> behind the host Caddy; without it the instance is
      # localhost-only. Set it in portal/.env on the server, e.g.
      #   AKDMI_BASE_DOMAIN=75-119-136-160.nip.io
      AKDMI_BASE_DOMAIN: ${AKDMI_BASE_DOMAIN:-}
      # Interface the instances it provisions bind to. Never 0.0.0.0 on a public box.
      AKDMI_BIND_HOST: ${BIND_HOST:-127.0.0.1}
      # Legacy, still honoured by init.sh when AKDMI_BASE_DOMAIN is empty.
      AKDMI_PUBLIC_HOST: ${AKDMI_PUBLIC_HOST:-localhost}
      AKDMI_PUBLIC_SCHEME: ${AKDMI_PUBLIC_SCHEME:-http}
    ports:
      # Loopback: the portal is reached through the host's Caddy, which terminates
      # TLS for it like every other app on the box. Published here only so Caddy
      # has something to proxy to.
      - "${BIND_HOST:-127.0.0.1}:${PORTAL_PORT:-3099}:3000"
    volumes:
      # Talk to the host's docker daemon so spawned `akd-mi up <slug>` actually
      # creates containers next to the portal (not nested inside it).
      - /var/run/docker.sock:/var/run/docker.sock
      # Expose the akd-mi project (akd-mi script, scripts/, templates/, instances/)
      # at the SAME path as on the host so docker compose's --project-directory
      # works whether evaluated by the CLI inside the container or by the daemon.
      - ${AKDMI_PROJECT_DIR:-/opt/akd-mi-v2}:${AKDMI_PROJECT_DIR:-/opt/akd-mi-v2}

volumes:
  portal_db:
