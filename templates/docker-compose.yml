# AKD-MI base stack — one instance per institution.
# Project name is set by the CLI via `-p akdmi-<slug>`.
# All ports are bound via env vars set in instances/<slug>/.env.

services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [stack]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [stack]

  minio:
    # MinIO deleted minio/minio and minio/mc from Docker Hub in September 2026 and
    # stopped serving them anonymously from quay.io days later, so `:latest` stopped
    # resolving at all — every new instance died at `docker compose up`. This is
    # Chainguard's free source-built image of the same AGPL server.
    #
    # Pinned by digest, where the old reference floated on :latest. That was already
    # the wrong shape for a service holding an instance's uploads — a recreate could
    # jump versions and migrate the volume format unasked — and the free tier
    # publishes no version tags anyway. Re-pin deliberately with:
    #   docker pull cgr.dev/chainguard/minio:latest
    #   docker image inspect cgr.dev/chainguard/minio:latest --format '{{index .RepoDigests 0}}'
    #
    # NOTE: runs as uid 65532 where MinIO's own ran as root, so an instance that
    # already has objects needs its volume chowned once, with the stack down:
    #   docker run --rm -v akdmi-<slug>_minio-data:/d alpine chown -R 65532:65532 /d
    image: cgr.dev/chainguard/minio@sha256:a05a4497e8dce3cb7a7a1bf1872ba5d30ea988f1e8c22c9e0920503761c4b5f1
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_UI_PORT}:9001"
    healthcheck:
      # `mc ready local`, not curl: the Chainguard image ships no curl (nor wget, nor
      # nc), so the old probe could never succeed. It would not have failed loudly
      # either — minio simply never turns healthy, and minio-init and api both wait
      # on service_healthy, so the whole instance hangs instead of erroring.
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [stack]

  minio-init:
    # Same image as the server above: it carries both `mc` and a shell, so the
    # inline entrypoint below runs unchanged. Chainguard's separate minio-client
    # image is distroless and would leave `/bin/sh -c` nothing to run.
    image: cgr.dev/chainguard/minio@sha256:a05a4497e8dce3cb7a7a1bf1872ba5d30ea988f1e8c22c9e0920503761c4b5f1
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb -p local/${S3_BUCKET} || true &&
      mc anonymous set download local/${S3_BUCKET}/public || true &&
      echo 'MinIO bucket ready.'
      "
    networks: [stack]
    restart: "no"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV}
      LOG_LEVEL: ${LOG_LEVEL}
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL}
      SESSION_SECRET: ${SESSION_SECRET}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME}
      INSTANCE_SLUG: ${INSTANCE_SLUG}
      INSTANCE_NAME: ${INSTANCE_NAME}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL}
    ports:
      - "${API_PORT}:4000"
    networks: [stack]

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL}
        NEXT_PUBLIC_INSTANCE_NAME: ${INSTANCE_NAME}
        NEXT_PUBLIC_INSTANCE_CATEGORY: ${INSTANCE_CATEGORY}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: ${NODE_ENV}
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL}
      NEXT_PUBLIC_INSTANCE_NAME: ${INSTANCE_NAME}
      NEXT_PUBLIC_INSTANCE_CATEGORY: ${INSTANCE_CATEGORY}
      INTERNAL_API_URL: http://api:4000
    ports:
      - "${WEB_PORT}:3000"
    networks: [stack]

networks:
  stack:
    driver: bridge

volumes:
  db-data:
  redis-data:
  minio-data:
